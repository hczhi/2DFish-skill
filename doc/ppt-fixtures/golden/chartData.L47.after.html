<section class="slide" data-demo="L47">
  <div class="slide-header"><div class="kicker">内容</div></div>
  <div class="slide-inner">
    <div class="rp-head">
      <h1 class="page-title">时间花在哪儿</h1>
      <div class="lead">一份 30 页提案从贴进提纲到拿到成稿，各段实测耗时。条的长短由数值本身算出来，不是照着眼睛画的。</div>
    </div>
    <div class="dt-unit">
      <span>单位：分钟</span>
      <span>口径：单份 30 页</span>
    </div>
    <div class="l47-rows" style="--bar-max:20">
      <div class="l47-row" style="--bar-v:3">
        <div class="l47-name">提纲清洗<em>OUTLINE</em></div>
        <div class="l47-track"><div class="l47-fill"></div><div class="l47-gap"></div></div>
        <div class="l47-val">3<i>分钟</i></div>
      </div>
      <div class="l47-row" style="--bar-v:5">
        <div class="l47-name">整份规划<em>PLAN</em></div>
        <div class="l47-track"><div class="l47-fill"></div><div class="l47-gap"></div></div>
        <div class="l47-val">5<i>分钟</i></div>
      </div>
      <div class="l47-row on" style="--bar-v:19">
        <div class="l47-name">逐页生成<em>BUILD</em></div>
        <div class="l47-track"><div class="l47-fill"></div><div class="l47-gap"></div></div>
        <div class="l47-val">19<i>分钟</i></div>
      </div>
      <div class="l47-row" style="--bar-v:11">
        <div class="l47-name">配图<em>IMAGES</em></div>
        <div class="l47-track"><div class="l47-fill"></div><div class="l47-gap"></div></div>
        <div class="l47-val">11<i>分钟</i></div>
      </div>
      <div class="l47-row dim" style="--bar-v:2">
        <div class="l47-name">导出 PDF<em>EXPORT</em></div>
        <div class="l47-track"><div class="l47-fill"></div><div class="l47-gap"></div></div>
        <div class="l47-val">2<i>分钟</i></div>
      </div>
    </div>
    <div class="dt-src">同一条接入点、同一份提纲连跑五次取中位数；人工核分页和挑图的时间不计入。</div>
    <div class="rp-foot">四十分钟里 <b>一半花在逐页生成</b> —— 想再快只有关掉思维链那一个开关，砍 prompt 没用。</div>
  </div>
</section>
